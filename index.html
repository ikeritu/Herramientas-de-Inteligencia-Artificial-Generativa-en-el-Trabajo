    return `<button class="opt ${cls}" data-act="answer" data-k="${k}" ${Q.sel!=null?'disabled':''}>${esc(o)}</button>`;}).join('')}
  ${Q.sel!=null?`<div class="why"><b style="color:var(--${Q.sel===q.a?'good':'bad'})">${Q.sel===q.a?'Correcto.':'Incorrecto.'}</b> ${esc(q.why)}</div>
  <button class="btn" data-act="qnext" data-t="${t}" data-lv="${lv}">${Q.i===list.length-1?'Ver resultado':'Siguiente'}</button>`:''}`;
}
function deckCards(){
  const d=ui.flash.deck; const out=[];
  COURSE.forEach((c,t)=>{ if(d==='all'||+d===t) c.cards.forEach((cd,i)=>{ if(ui.flash.lv==='all'||cd[2]===ui.flash.lv) out.push({t,i,f:cd[0],b:cd[1],lv:cd[2],k:c.id+':'+i}); }); });
  return out;
}
function vReview(){
  const F=ui.flash; const cards=deckCards();
  const dk=F.deck+'|'+F.lv; if(!F.order||F.order.length!==cards.length||F.orderDeck!==dk){ F.order=shuffle(cards.map((_,i)=>i)); F.orderDeck=dk; F.i=0; F.flipped=false; }
  const total=cards.length; const known=cards.filter(c=>P.cards[c.k]).length;
  const cur=cards[F.order[F.i]];
  const decks=`<div class="decks" role="group" aria-label="Mazo"><button class="deck" aria-pressed="${F.deck==='all'}" data-act="deck" data-deck="all">Todos</button>${COURSE.map((c,t)=>`<button class="deck" aria-pressed="${F.deck==t}" data-act="deck" data-deck="${t}">Tema ${t+1}</button>`).join('')}</div>`;
  const lvs=`<div class="decks" role="group" aria-label="Nivel">${[['all','Todos los niveles'],['b','Principiante'],['i','Intermedio'],['a','Avanzado']].map(x=>`<button class="deck" aria-pressed="${F.lv===x[0]}" data-act="lvl" data-lv="${x[0]}">${x[1]}</button>`).join('')}</div>`;
  if(!cur) return `<h2 style="margin-bottom:12px">Repaso</h2>${decks}${lvs}<p class="muted">No hay tarjetas.</p>`;
  return `<h2 style="margin-bottom:12px">Repaso</h2>${decks}${lvs}
  <div class="row" style="margin-bottom:10px"><div class="bar grow"><i style="width:${known/total*100}%"></i></div><span class="small muted">${known}/${total} dominadas</span></div>
  <button class="flip" data-act="flip" aria-label="Girar tarjeta">
    ${!F.flipped?`<div class="face front"><small>Tema ${cur.t+1} · ${LV[cur.lv]} · toca para girar</small><p>${esc(cur.f)}</p></div>`:`<div class="face back-face"><small style="color:var(--teal)">${esc(cur.f)}</small><p>${esc(cur.b)}</p></div>`}
  </button>
  <div class="row" style="margin-top:14px">
    <button class="btn alt" data-act="again">Repetir</button><button class="btn" data-act="know">Ya la sé</button>
  </div>
  <p class="muted small" style="text-align:center;margin-top:10px">Tarjeta ${F.i+1} de ${total}</p>`;
}
function buildExam(){
  const pool=[]; COURSE.forEach((c,t)=>{ const all=shuffle([...c.qz.b,...c.qz.i,...c.qz.a]); all.slice(0,2).forEach(q=>pool.push(Object.assign({t},q))); });
  return shuffle(pool);
}

  <div class="stat" style="margin-top:10px"><b>${P.exam!=null?P.exam+'%':'—'}</b><span>examen final${P.exam>=70?' (aprobado)':''}</span></div>
  <p class="muted small" style="margin-top:14px">Un tema se marca como completado al terminar sus lecciones de los tres niveles y sacar al menos un 60 % en el test principiante. El progreso se guarda en este navegador.</p>
  <div style="margin-top:16px">${ui.confirmReset?`<div class="row"><button class="btn alt small" data-act="resetno">Cancelar</button><button class="btn small" data-act="resetyes">Sí, borrar progreso</button></div>`:`<button class="btn alt small" data-act="reset">Reiniciar progreso</button>`}</div>`;
}

/* ============================== RENDER ============================== */
function render(){
  const v=ui.view; let h='';
  if(v.name==='home') h = ui.tab==='review'?vReview(): ui.tab==='progress'?vProgress(): vHome();
  else if(v.name==='topic') h=vTopic(v.t);
  else if(v.name==='lesson') h=vLesson(v.t,v.l);
  else if(v.name==='quiz') h=vQuiz(v.t,v.lv);
  else if(v.name==='exam') h=vExam();
  else if(v.name==='cert') h=vCert();
  $main.innerHTML=h;
  document.querySelectorAll('nav button').forEach(b=>{ if(b.dataset.tab===ui.tab && v.name==='home') b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if(v.name==='lesson'){ refreshPromptLab(); refreshCostLab(); }
}

/* ============================== EVENTOS ============================== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, t=+b.dataset.t, l=+b.dataset.l;
  switch(a){
    case 'tab': ui.tab=b.dataset.tab; ui.confirmReset=false; go({name:'home'}); break;
    case 'home': ui.tab='home'; go({name:'home'}); break;
    case 'topic': go({name:'topic',t}); break;
    case 'lesson': go({name:'lesson',t,l}); break;
    case 'finish':{
      const id=COURSE[t].id; const arr=P.lessons[id]||(P.lessons[id]=[]);
      const first=!arr[l]; arr[l]=true;
      if(first){ addXp(10); }
      const last=l===COURSE[t].lessons.length-1;
      if(last){ toast(first?'Lección completada · +10 XP':'Lección completada'); go({name:'topic',t}); }
      else go({name:'lesson',t,l:l+1});
      save(); break; }
    case 'quiz': ui.quiz={i:0,sel:null,score:0}; go({name:'quiz',t,lv:b.dataset.lv||'b'}); break;
    case 'answer':{
      const k=+b.dataset.k, q=COURSE[ui.view.t].qz[ui.view.lv][ui.quiz.i];
      if(ui.quiz.sel!=null) break;
      ui.quiz.sel=k; if(k===q.a) ui.quiz.score++;
      render(); break; }
    case 'qnext':{
      ui.quiz.i++; ui.quiz.sel=null;
      const c=COURSE[t]; const lv=b.dataset.lv||'b'; const key=qkey(c,lv);
      if(ui.quiz.i>=c.qz[lv].length){
        const p=Math.round(ui.quiz.score/c.qz[lv].length*100);
        P.quiz[key]=Math.max(P.quiz[key]||0,p); addXp(ui.quiz.score*5);
      }
      render(); $main.scrollTop=0; break; }
    case 'risk':{ const S=ui.lab[b.dataset.n]||(ui.lab[b.dataset.n]={}); const i=+b.dataset.i; if(S[i]==null){ S[i]=+b.dataset.k; render(); } break; }
    case 'copyprompt':{
      const txt=promptText(); if(!txt){ toast('Escribe algo primero'); break; }
      try{ navigator.clipboard.writeText(txt).then(()=>toast('Prompt copiado'),()=>toast('No se pudo copiar')); }catch(err){ toast('No se pudo copiar'); }
      break; }
    case 'deck': ui.tab='review'; ui.flash.deck=b.dataset.deck; ui.flash.order=null; go({name:'home'}); break;
    case 'lvl': ui.flash.lv=b.dataset.lv; ui.flash.order=null; render(); break;
    case 'flip': ui.flash.flipped=!ui.flash.flipped; render(); break;
    case 'again': case 'know':{
      const cards=deckCards(); const F=ui.flash; const cur=cards[F.order[F.i]];
      if(cur){ if(a==='know'){ if(!P.cards[cur.k]){ P.cards[cur.k]=1; addXp(2);} } else delete P.cards[cur.k]; save(); }
      F.i=(F.i+1)%F.order.length; F.flipped=false; render(); break; }
    case 'exam': ui.exam={qs:buildExam(),i:0,sel:null,score:0}; go({name:'exam'}); break;
    case 'eanswer':{ const E=ui.exam; if(E.sel!=null) break; E.sel=+b.dataset.k; if(E.sel===E.qs[E.i].a) E.score++; render(); break; }
    case 'enext':{
      const E=ui.exam; E.i++; E.sel=null;
      if(E.i>=E.qs.length){ const p=Math.round(E.score/E.qs.length*100); const first=!(P.exam>=70)&&p>=70; P.exam=Math.max(P.exam||0,p); if(first) addXp(50); else save(); }
      render(); $main.scrollTop=0; break; }
    case 'cert': go({name:'cert'}); break;
    case 'reset': ui.confirmReset=true; render(); break;
    case 'resetno': ui.confirmReset=false; render(); break;
    case 'resetyes': P={lessons:{},quiz:{},cards:{},xp:0,days:[]}; save(); ui.confirmReset=false; render(); toast('Progreso reiniciado'); break;
  }
});
document.addEventListener('input',e=>{
  const ck=e.target.dataset&&e.target.dataset.cost;
  if(ck){ ui.lab.cost[ck]=+e.target.value; refreshCostLab(); return; }
  if(e.target.id==='cert-name'){ P.name=e.target.value.slice(0,60); save(); const n=document.getElementById('cert-who'); if(n) n.textContent=P.name.trim()||'Tu nombre'; return; }
  const k=e.target.dataset&&e.target.dataset.lab; if(!k) return;
  (ui.lab.prompt||(ui.lab.prompt={}))[k]=e.target.value; refreshPromptLab();
});
render();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
</body>
</html>
